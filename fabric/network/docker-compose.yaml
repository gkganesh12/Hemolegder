version: '3.7'

networks:
  bloodbank:
    name: fabric_bloodbank

volumes:
  orderer.example.com:
  peer0.bloodbank.example.com:
  peer0.hospital.example.com:
  peer0.regulator.example.com:

services:
  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./config/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - orderer.example.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
    networks:
      - bloodbank

  peer0.bloodbank.example.com:
    container_name: peer0.bloodbank.example.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - DOCKER_API_VERSION=1.44
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_bloodbank
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.bloodbank.example.com
      - CORE_PEER_ADDRESS=peer0.bloodbank.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bloodbank.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bloodbank.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bloodbank.example.com:7051
      - CORE_PEER_LOCALMSPID=BloodBankMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_CHAINCODE_EXTERNALBUILDERS=[{"name":"ccaas_builder","path":"/builders/ccaas"}]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/bloodbank.example.com/peers/peer0.bloodbank.example.com/msp:/etc/hyperledger/fabric/msp
      - ./config:/etc/hyperledger/configtx
      - ../chaincode:/opt/gopath/src/github.com/chaincode
      - peer0.bloodbank.example.com:/var/hyperledger/production
      - ./builders:/builders
    ports:
      - 7051:7051
    depends_on:
      - orderer.example.com
    networks:
      - bloodbank

  peer0.hospital.example.com:
    container_name: peer0.hospital.example.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - DOCKER_API_VERSION=1.44
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_bloodbank
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.hospital.example.com
      - CORE_PEER_ADDRESS=peer0.hospital.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospital.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospital.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospital.example.com:9051
      - CORE_PEER_LOCALMSPID=HospitalMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_CHAINCODE_EXTERNALBUILDERS=[{"name":"ccaas_builder","path":"/builders/ccaas"}]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/hospital.example.com/peers/peer0.hospital.example.com/msp:/etc/hyperledger/fabric/msp
      - ./config:/etc/hyperledger/configtx
      - ../chaincode:/opt/gopath/src/github.com/chaincode
      - peer0.hospital.example.com:/var/hyperledger/production
      - ./builders:/builders
    ports:
      - 9051:9051
    depends_on:
      - orderer.example.com
    networks:
      - bloodbank

  peer0.regulator.example.com:
    container_name: peer0.regulator.example.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - DOCKER_API_VERSION=1.44
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_bloodbank
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.regulator.example.com
      - CORE_PEER_ADDRESS=peer0.regulator.example.com:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.regulator.example.com:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.regulator.example.com:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.regulator.example.com:11051
      - CORE_PEER_LOCALMSPID=RegulatorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_CHAINCODE_EXTERNALBUILDERS=[{"name":"ccaas_builder","path":"/builders/ccaas"}]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/regulator.example.com/peers/peer0.regulator.example.com/msp:/etc/hyperledger/fabric/msp
      - ./config:/etc/hyperledger/configtx
      - ../chaincode:/opt/gopath/src/github.com/chaincode
      - peer0.regulator.example.com:/var/hyperledger/production
      - ./builders:/builders
    ports:
      - 11051:11051
    depends_on:
      - orderer.example.com
    networks:
      - bloodbank

  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.bloodbank.example.com:7051
      - CORE_PEER_LOCALMSPID=BloodBankMSP
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/bloodbank.example.com/users/Admin@bloodbank.example.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../chaincode:/opt/gopath/src/github.com/chaincode
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ./config:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../chaincode/bloodbank-ccaas:/ccaas
    depends_on:
      - orderer.example.com
      - peer0.bloodbank.example.com
      - peer0.hospital.example.com
      - peer0.regulator.example.com
    networks:
      - bloodbank

  chaincode-bloodbank:
    container_name: chaincode-bloodbank
    build:
      context: ../chaincode/bloodbank
      dockerfile: Dockerfile
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=${CHAINCODE_ID:-bloodbank_1.0:placeholder}
    ports:
      - 9999:9999
    networks:
      - bloodbank
